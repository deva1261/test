name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      board-db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: board
          POSTGRES_PASSWORD: board
          POSTGRES_DB: board
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U board -d board"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://board:board@localhost:5432/board
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Apply board-db migrations
        run: npm run migrate
      - name: Re-running migrations is a no-op
        run: npm run migrate | grep -q "up to date"
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: board-api:ci
