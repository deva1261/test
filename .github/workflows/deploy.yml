name: Deploy auth-api

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-auth-api
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/auth-api

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - name: Migrate auth-db
        env:
          DATABASE_URL: ${{ secrets.AUTH_DATABASE_URL }}
        run: |
          docker run --rm -e DATABASE_URL \
            "$IMAGE:${{ needs.build.outputs.tag }}" node dist/scripts/migrate.js
      - name: Roll out auth-api
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.AUTH_API_DEPLOY_WEBHOOK_URL }}
        run: |
          # Hand the new image tag to the hosting platform (Render/Fly/ECS/etc.).
          curl --fail -sS -X POST "$DEPLOY_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"image\":\"$IMAGE:${{ needs.build.outputs.tag }}\"}"
      - name: Smoke test
        env:
          AUTH_API_URL: ${{ vars.AUTH_API_URL }}
        run: |
          for i in $(seq 1 30); do
            curl --fail -sS "$AUTH_API_URL/healthz" && exit 0
            sleep 10
          done
          echo "auth-api did not become healthy" && exit 1
