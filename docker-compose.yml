services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 2s
      retries: 30

  api:
    build: .
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://auth:auth@db:5432/auth?sslmode=disable
      ADDR: ":8080"
      BCRYPT_COST: "12"
      SESSION_TTL: 24h
      COOKIE_SECURE: "true"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
