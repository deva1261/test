services:
  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    ports:
      - "5432:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-migrate:
    build: .
    command: ["node", "dist/scripts/migrate.js"]
    environment:
      DATABASE_URL: postgres://auth:auth@auth-db:5432/auth
    depends_on:
      auth-db:
        condition: service_healthy

  auth-api:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgres://auth:auth@auth-db:5432/auth
      COOKIE_SECURE: "false"
    ports:
      - "3000:3000"
    depends_on:
      auth-migrate:
        condition: service_completed_successfully

volumes:
  auth-db-data:
