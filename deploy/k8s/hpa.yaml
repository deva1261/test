# Scale auth-api out on CPU peaks (RSK-001): bcrypt makes login CPU-bound, so
# CPU utilisation is the signal that tracks login load.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: authservice
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: authservice
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    # React to a burst within a minute...
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    # ...but shed capacity slowly so a pulsed attack does not flap.
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
